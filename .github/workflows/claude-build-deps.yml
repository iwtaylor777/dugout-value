# Temporary helper for an AI-assisted review session. It installs dependencies on a
# Linux runner and publishes them as a prerelease asset so a sandbox without npm
# access can build the site. Safe to delete along with the claude/* branch.
name: claude-build-deps
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          set +e
          npm ci --no-audit --no-fund > ci.log 2>&1
          echo "npm ci exit $?" >> ci.log
          tail -40 ci.log
          if [ -d node_modules ]; then tar czf node_modules-linux-x64.tgz node_modules; fi
          ls -la >> ci.log
          true
      - name: Publish temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete claude-build-deps -y --cleanup-tag 2>&1 || true
          FILES="ci.log"
          [ -f node_modules-linux-x64.tgz ] && FILES="$FILES node_modules-linux-x64.tgz"
          gh release create claude-build-deps $FILES \
            --prerelease --target "${{ github.sha }}" \
            --title "Temporary build dependencies (claude/site-review)" \
            --notes "Temporary artifact for a review session. Safe to delete." 2>&1 | tee release.log
      - name: Fallback log push
        if: failure()
        run: |
          git config user.email actions@github.com; git config user.name actions
          git checkout -b claude/site-review-logs
          git add -f ci.log release.log 2>/dev/null || git add -f ci.log
          git commit -m "logs" && git push -f origin claude/site-review-logs
